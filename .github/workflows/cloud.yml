name: Emplio Cloud
# Going live: a push to `production` here deploys emplio.app and runs Emplio Cloud's private checks.
# Those run and log in its own repo. Only in this repo, and only once its token is set: forks skip this.
on:
  push:
    branches: [production]
jobs:
  tell:
    if: github.repository == 'emplio-app/emplio'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CLOUD_TOKEN }}
          REPO: ${{ secrets.CLOUD_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$REPO" ]; then echo "Not set up"; exit 0; fi
          for workflow in deploy.yml ci.yml; do
            # on its production branch if it has one, else main
            gh workflow run "$workflow" -R "$REPO" --ref production -f ref="$GITHUB_SHA" 2>/dev/null ||
              gh workflow run "$workflow" -R "$REPO" --ref main -f ref="$GITHUB_SHA"
          done
          echo "Sent"
