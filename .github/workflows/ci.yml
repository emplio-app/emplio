name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# a newer push replaces the run still going for the same branch or pull request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides what this run needs beyond the quick tests. A job skipped by its `if` still counts as passed for a required check.
  plan:
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.plan.outputs.install }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          install=true
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the pull request merged into its target, so this is exactly what it changes
            git diff --name-only HEAD^1 HEAD |
              grep -qE '^(docker/|runner/|docker-compose\.yml$|install\.sh|setup\.sh$|\.env\.example$|\.dockerignore$|bun\.lock$|(.*/)?package\.json$|frontend/next\.config|backend/src/(computer|browser)|\.github/workflows/ci\.yml$)' ||
              install=false
          elif [ "$EVENT" = push ]; then
            # a version not yet released is published; a failed publish is retried by the next push
            version="$(grep -m1 -oP '^## \K\d+\.\d+\.\d+' CHANGELOG.md)"
            if gh release view "v$version" >/dev/null 2>&1; then install=false; else echo "version=$version" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "install=$install" >> "$GITHUB_OUTPUT"
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      GITEA_URL: http://localhost:3399
      FILE_DIR: /tmp/emplio-files
      RUNNER_TOKEN: test-only
      COMPUTER_RUNNER_URL: http://localhost:4199
    steps:
      - uses: actions/checkout@v4
      # people check the install script against this before running it, so it must match
      - name: install.sh.sha256 matches install.sh
        run: |
          sha256sum -c install.sh.sha256 || { echo "install.sh changed: run 'shasum -a 256 install.sh > install.sh.sha256' and commit it"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Start Gitea for the tests
        run: |
          docker run -d --name gitea -p 3399:3000 -e GITEA__security__INSTALL_LOCK=true gitea/gitea:1.24
          for i in $(seq 1 30); do curl -fsS http://localhost:3399/api/v1/version >/dev/null 2>&1 && break; sleep 2; done
          token="$(docker exec -u git gitea gitea admin user create --config /data/gitea/conf/app.ini --admin --username employee0 --random-password --email bot@emplio.local --must-change-password=false --access-token | grep -oE '[0-9a-f]{40}' | head -n1)"
          echo "GITEA_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: cd backend && bun run db:migrate && bun run test
      - run: bun test runner
  # the real thing: build every image and run it the way an install does, with none of the test settings above
  docker:
    needs: plan
    if: needs.plan.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bash docker/smoke.sh
  # Only what passed the checks above is published. Installs download these instead of building.
  images:
    needs: [plan, check, docker]
    if: needs.plan.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, runner, computer, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ needs.plan.outputs.version }}
  # A new version at the top of CHANGELOG.md becomes a GitHub release, its whole section the notes.
  release:
    needs: [plan, images]
    if: needs.plan.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ needs.plan.outputs.version }}
        run: |
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md
          gh release create "v$version" --title "$version" --notes-file notes.md --target "$GITHUB_SHA"
