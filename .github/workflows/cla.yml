name: Contributor agreement
# Asks each first-time contributor to sign CLA.md on their pull request, and blocks merging until they have.
# Signatures are kept in this repo, on the cla-signatures branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/emplio-app/emplio/blob/main/CLA.md
          branch: cla-signatures
          # the Emplio team, and bots
          allowlist: ashish141199,Emplio,dependabot[bot],github-actions[bot]
