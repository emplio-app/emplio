<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emplio</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --mute:#6b6b6b; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#f2f2f2; --mute:#9a9a9a; --line:#2a2a2a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .drag { position: fixed; inset: 0 0 auto 0; height: 56px; -webkit-app-region: drag; }
  main { max-width: 380px; padding: 0 24px; text-align: center; }
  .mark { width: 72px; height: 72px; display: block; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 650; }
  p { margin: 0 0 20px; color: var(--mute); }
  button { font: inherit; font-weight: 550; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button:hover { background: var(--line); }
  small { display: block; margin-top: 16px; color: var(--mute); font-size: 13px; }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <img class="mark" src="logo.png" alt="Emplio">
  <h1>You're offline</h1>
  <p>Emplio will come back by itself as soon as your internet does. Anything Emplio is doing in the cloud keeps going meanwhile.</p>
  <button id="retry">Try again</button>
  <small id="note"></small>
</main>
<script>
  const to = new URLSearchParams(location.search).get("to");
  const note = document.getElementById("note");
  async function check() {
    note.textContent = "Checking…";
    try {
      await fetch(to, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(6000) });
      location.href = to;
    } catch {
      note.textContent = "Still can't reach Emplio.";
    }
  }
  document.getElementById("retry").onclick = check;
  addEventListener("online", check);
  setInterval(check, 5000);
</script>
</body>
</html>
