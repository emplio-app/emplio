<!doctype html>
<meta charset="utf-8" />
<title>Watching</title>
<style>
  :root { --popover: #1f1f21; --popover-foreground: #f2f2f4; --border: #333336; --primary: #5bb98a; --primary-foreground: #fff; --muted-foreground: #98989d; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/20px system-ui, -apple-system, sans-serif; user-select: none; cursor: default; }
  /* the same pill as the cloud browser's (browser-panel.tsx) */
  .pill { position: absolute; bottom: 16px; left: 50%; transform: translate(-50%, 8px); display: flex; align-items: center; gap: 12px; white-space: nowrap; padding: 6px 6px 6px 16px; border-radius: 999px; background: color-mix(in oklab, var(--popover) 95%, transparent); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
  body:hover .pill { opacity: 0.9; transform: translate(-50%, 0); pointer-events: auto; }
  body.nudged .pill { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .eye { color: var(--muted-foreground); }
  button { font: 500 14px/20px system-ui, -apple-system, sans-serif; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); cursor: pointer; }
  button svg { width: 14px; height: 14px; }
</style>
<div class="pill">
  <svg class="eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>
  <span id="text">You're watching</span>
  <button id="take">
    <svg viewBox="0 0 24 24"><path d="M14 4.1 12 6" /><path d="m5.1 8-2.9-.8" /><path d="m6 12-1.9 2" /><path d="M7.2 2.2 8 5.1" /><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z" /></svg>
    Take control
  </button>
</div>
<script>
  let timer;
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    document.body.classList.add("nudged");
    document.getElementById("text").textContent = "Emplio is using this browser";
    clearTimeout(timer);
    timer = setTimeout(() => { document.body.classList.remove("nudged"); document.getElementById("text").textContent = "You're watching"; }, 3500);
  });
  document.getElementById("take").onclick = () => window.emplioPane.act("take");
  // the app's own colours (light or dark), from the page
  window.emplioPane.onState((s) => { for (const [k, v] of Object.entries(s.skin ?? {})) document.documentElement.style.setProperty(`--${k}`, v); });
</script>
